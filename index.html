<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf8">
<title>Bank słówek — Angielski</title>
<script>
  (function(){
    var saved = null;
    try { saved = localStorage.getItem("bankSlowek.theme"); } catch (e) {}
    var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<style>
  :root{
    --bg:#fafaf8;
    --card:#ffffff;
    --ink:#17171a;
    --muted:#8c8c86;
    --line:#e6e6e0;
    --ok:#12724a;
    --bad:#c0392b;
    --solid:#17171a;
    --solid-fg:#ffffff;
    --field:#fafaf8;
    --placeholder:#b6b6b0;
  }
  :root[data-theme="dark"]{
    --bg:#0f0f11;
    --card:#161618;
    --ink:#ededeb;
    --muted:#8a8a87;
    --line:#2b2b2f;
    --ok:#4ade80;
    --bad:#f87171;
    --solid:#ededeb;
    --solid-fg:#111113;
    --field:#1c1c1f;
    --placeholder:#606065;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:620px;margin:0 auto;padding:44px 20px 96px}

  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}
  .top-actions{display:flex;align-items:center;gap:18px}
  h1{
    margin:0;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  }
  .theme-btn .ico-sun{display:none}
  :root[data-theme="dark"] .theme-btn .ico-sun{display:block}
  :root[data-theme="dark"] .theme-btn .ico-moon{display:none}
  .link{
    border:0;background:none;padding:0;font-family:inherit;font-size:12.5px;color:var(--muted);
    cursor:pointer;letter-spacing:.02em;transition:color .15s;
  }
  .link:hover{color:var(--ink)}

  .tabs{display:flex;gap:22px;margin-bottom:26px;border-bottom:1px solid var(--line)}
  .tab{
    border:0;background:none;padding:0 0 11px;margin-bottom:-1px;font-family:inherit;
    font-size:14px;color:var(--muted);cursor:pointer;border-bottom:1.5px solid transparent;transition:color .15s
  }
  .tab:hover{color:var(--ink)}
  .tab.is-active{color:var(--ink);border-bottom-color:var(--ink)}

  /* tools */
  .seg{
    display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--card)
  }
  .seg-btn{
    border:0;background:none;font-family:inherit;font-size:12.5px;font-weight:500;letter-spacing:.03em;
    color:var(--muted);padding:7px 15px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s
  }
  .seg-btn:hover{color:var(--ink)}
  .seg-btn.is-active{background:var(--solid);color:var(--solid-fg)}

  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .filter{
    border:1px solid transparent;background:none;font-family:inherit;font-size:12.5px;color:var(--muted);
    padding:6px 10px;border-radius:8px;cursor:pointer;transition:color .15s,border-color .15s
  }
  .filter:hover{color:var(--ink)}
  .filter.is-active{color:var(--ink);border-color:var(--line)}
  .filter .n{opacity:.5;margin-left:4px}

  .tools{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:26px}

  /* card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 28px 28px}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:24px}
  .cat{
    font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)
  }
  .icon-btn{
    border:0;background:none;padding:4px;color:var(--muted);cursor:pointer;line-height:0;border-radius:6px;transition:color .15s
  }
  .icon-btn:hover{color:var(--ink)}
  .icon-btn svg{width:17px;height:17px}

  .label{
    margin:22px 0 8px;font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)
  }
  .prompt{
    margin:0 0 26px;font-size:clamp(27px,5.2vw,36px);line-height:1.24;font-weight:600;letter-spacing:-.025em;
    word-break:break-word
  }

  form.answer{display:flex;gap:8px}
  .input{
    flex:1 1 auto;min-width:0;height:50px;padding:0 15px;font-family:inherit;font-size:16.5px;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:10px;outline:none;
    transition:border-color .15s
  }
  .input::placeholder{color:var(--placeholder)}
  .input:focus{border-color:var(--ink)}
  .input[readonly]{background:var(--field)}
  .btn{
    flex:0 0 auto;height:50px;padding:0 20px;border:1px solid var(--solid);border-radius:10px;
    background:var(--solid);color:var(--solid-fg);font-family:inherit;font-size:14px;font-weight:500;
    cursor:pointer;transition:opacity .15s
  }
  .btn:hover{opacity:.85}

  .feedback{
    min-height:22px;margin-top:14px;font-size:13.5px;color:var(--muted);display:flex;align-items:center;
    justify-content:space-between;gap:12px
  }
  .feedback.ok .hint{color:var(--ok)}
  .feedback.bad .hint{color:var(--bad)}
  .feedback b{font-weight:600}

  /* meta */
  .meta{
    display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;
    margin-top:22px;font-size:12.5px;color:var(--muted)
  }
  .progress{height:2px;margin-top:12px;background:var(--line);border-radius:2px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s ease}

  /* flashcards */
  .deck-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .flip{perspective:1400px;height:250px;cursor:pointer;outline:none}
  .flip:focus-visible .face{border-color:var(--ink)}
  .flip-inner{
    position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.3,.8,.3,1)
  }
  .flip.is-flipped .flip-inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:28px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;
    backface-visibility:hidden;-webkit-backface-visibility:hidden
  }
  .face-back{transform:rotateY(180deg)}
  .fc-word{
    margin:0;font-size:clamp(24px,4.4vw,32px);line-height:1.24;font-weight:600;letter-spacing:-.02em;word-break:break-word
  }
  .fc-hint{font-size:12px;color:var(--muted)}
  .fc-actions{display:flex;gap:10px;margin-top:14px}
  .fc-actions .btn{flex:1 1 0}
  .fc-actions:not(.is-ready){pointer-events:none}
  .fc-actions:not(.is-ready) .btn{background:transparent;color:var(--muted);border-color:var(--line)}
  .btn.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.secondary:hover{opacity:1;border-color:var(--ink)}
  .btn[disabled]{cursor:default}

  /* list */
  .search{
    width:100%;height:46px;padding:0 14px;font-family:inherit;font-size:14.5px;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:10px;outline:none;margin-bottom:26px
  }
  .search:focus{border-color:var(--ink)}
  .search::placeholder{color:var(--placeholder)}

  .group{margin-bottom:28px}
  .group h3{
    margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)
  }
  .row{
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px
  }
  .row:last-child{border-bottom:0}
  .row .en{font-weight:500}
  .row .pl{color:var(--muted);text-align:right}
  .row.is-done .en::after{content:"✓";color:var(--ok);margin-left:7px;font-weight:600;font-size:12px}

  .empty{padding:40px 0;text-align:center;color:var(--muted);font-size:14px}
  .hidden{display:none !important}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;pointer-events:none;
    background:var(--solid);color:var(--solid-fg);font-size:12.5px;padding:9px 16px;border-radius:999px;transition:.25s
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:520px){
    .wrap{padding:30px 16px 72px}
    .card{padding:22px 18px}
    form.answer{flex-wrap:wrap}
    .input{flex:1 1 100%}
    form.answer .btn{flex:1 1 100%}
    .prompt{margin-bottom:22px}
    .flip{height:215px}
    .face{padding:20px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Bank słówek</h1>
    <div class="top-actions">
      <button class="icon-btn theme-btn" id="themeBtn" aria-label="Tryb ciemny" title="Tryb ciemny">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 14.6A8.6 8.6 0 0 1 9.4 4a8.6 8.6 0 1 0 10.6 10.6z"/>
        </svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/>
        </svg>
      </button>
      <button class="link" id="resetBtn">Reset</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab is-active" data-view="learn">Nauka</button>
    <button class="tab" data-view="list">Słówka</button>
    <button class="tab" data-view="flash">Fiszki</button>
  </nav>

  <div class="tools" id="tools">
    <div class="seg" id="dirSwitch" role="group" aria-label="Kierunek tłumaczenia">
      <button class="seg-btn is-active" data-dir="pl-en">PL → EN</button>
      <button class="seg-btn" data-dir="en-pl">EN → PL</button>
    </div>
    <div class="filters" id="chips"></div>
  </div>

  <section id="view-learn">
    <div class="card">
      <div class="card-head">
        <span class="cat" id="catPill">—</span>
        <button class="icon-btn" id="speakBtn" aria-label="Wymowa angielska" title="Wymowa angielska">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>
          </svg>
        </button>
      </div>

      <p class="label" id="promptLabel">Przetłumacz na angielski</p>
      <h2 class="prompt" id="prompt">…</h2>

      <form class="answer" id="answerForm" autocomplete="off">
        <input class="input" id="answerInput" type="text" placeholder="Wpisz tłumaczenie…"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="btn" type="submit" id="checkBtn">Sprawdź</button>
      </form>

      <div class="feedback" id="feedback" aria-live="polite">
        <span class="hint" id="hint"></span>
        <button type="button" class="link" id="revealBtn">Pokaż odpowiedź</button>
      </div>
    </div>

    <div class="meta">
      <span id="mLearned">Poznane 0 / 0</span>
      <span id="mStats">Poprawne 0 · Błędy 0 · Seria 0</span>
    </div>
    <div class="progress"><i id="barFill"></i></div>
  </section>

  <section id="view-flash" class="hidden">
    <div class="deck-head">
      <span class="cat" id="fcProgress">1 / 1</span>
      <span class="cat" id="fcCat">—</span>
    </div>

    <div class="flip" id="flip" role="button" tabindex="0" aria-expanded="false" aria-label="Odwróć fiszkę">
      <div class="flip-inner">
        <div class="face">
          <p class="fc-word" id="fcFront"></p>
          <span class="fc-hint">Kliknij albo naciśnij spację, aby odwrócić</span>
        </div>
        <div class="face face-back">
          <p class="fc-word" id="fcBack"></p>
          <span class="fc-hint">Znasz? Oceń poniżej</span>
        </div>
      </div>
    </div>

    <div class="fc-actions" id="fcActions">
      <button class="btn secondary" id="fcAgain" disabled>Nie znam</button>
      <button class="btn" id="fcKnown" disabled>Znam</button>
    </div>
  </section>

  <section id="view-list" class="hidden">
    <input class="search" id="search" type="search" placeholder="Szukaj po polsku lub angielsku…">
    <div id="listBody"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>

const state = {

  cat: "all",
  queue: [],

  answered: false,

  streak: 0,

const el = {

/* ---------- helpers ---------- */

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function escapeHtml(s){
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const PL_FOLD = {"ą":"a","ć":"c","ę":"e","ł":"l","ń":"n","ó":"o","ś":"s","ź":"z","ż":"z"};

function normalize(text){
  return String(text)
    .toLowerCase()
    .replace(/[ąćęłńóśźż]/g, (c) => PL_FOLD[c] || c)
    .replace(/[-–—]/g, " ")
    .replace(/[.,;:!?"'’()\[\]]/g, " ")
    .replace(/…/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

const ELLIPSIS = /…|\.\.\./;

function variants(answer){
  const set = new Set();
  const add = (s) => { const n = normalize(s); if (n) set.add(n); };
  const stripParens = (s) => s.replace(/\([^)]*\)/g, " ");

  add(answer);
  add(stripParens(answer));

  answer.split("/").forEach((part) => {
    const head = part.split(ELLIPSIS)[0];
    [part, stripParens(part), head, stripParens(head)].forEach(add);
  });

  answer.split(";").forEach((part) => {
    [part, stripParens(part)].forEach(add);
  });

  return [...set];
}

function matches(typed, answer){
  const t = normalize(typed);
  if (!t) return false;
  return variants(answer).includes(t);
}

function pool(){
  return state.cat === "all" ? WORDS : WORDS.filter((w) => w.cat === state.cat);
}

function questionText(w){ return state.dir === "pl-en" ? w.pl : w.en; }
function answerText(w){ return state.dir === "pl-en" ? w.en : w.pl; }

/* ---------- persistence ---------- */

function save(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      dir: state.dir,
      cat: state.cat,
      learned: [...state.learned],
      correct: state.correct,
      wrong: state.wrong
    }));
  } catch (e) { /* storage blocked */ }
}

function load(){
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    if (raw.dir === "pl-en" || raw.dir === "en-pl") state.dir = raw.dir;
    if (raw.cat === "all" || CAT_LABELS[raw.cat]) state.cat = raw.cat;
    if (Array.isArray(raw.learned)) state.learned = new Set(raw.learned);
    state.correct = Number(raw.correct) || 0;
    state.wrong = Number(raw.wrong) || 0;
  } catch (e) { /* ignore */ }
}

function toast(msg){
  el.toast.textContent = msg;
  el.toast.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.toast.classList.remove("show"), 2200);
}

/* ---------- quiz ---------- */

function startRound(){
  state.queue = shuffle(pool());
  ask();
  buildDeck();
}

function ask(){
  clearTimeout(state.timer);
  if (!state.queue.length){
    state.queue = shuffle(pool());
    toast("Nowa tura — wszystkie słówka od nowa");
  }
  state.current = state.queue.shift();
  state.answered = false;
  state.ok = false;
  renderQuestion();
}

function renderQuestion(){
  el.catPill.textContent = CAT_LABELS[state.current.cat];
  el.promptLabel.textContent = state.dir === "pl-en" ? "Przetłumacz na angielski" : "Przetłumacz na polski";
  el.prompt.textContent = questionText(state.current);

  el.input.value = "";
  el.input.readOnly = false;
  el.check.textContent = "Sprawdź";
  setFeedback("", "", true);

  updateMeta();
  el.input.focus({ preventScroll: true });
}

function setFeedback(kind, html, showReveal){
  el.feedback.className = "feedback" + (kind ? " " + kind : "");
  el.hint.innerHTML = html || "";
  el.revealBtn.classList.toggle("hidden", !showReveal);
}

function finish(ok){
  state.answered = true;
  state.ok = ok;
  el.input.readOnly = true;

  if (ok){
    state.correct++;
    state.streak++;
    state.learned.add(state.current.en);
    setFeedback("ok", "Dobrze", false);
    state.timer = setTimeout(ask, 720);
  } else {
    state.wrong++;
    state.streak = 0;
    el.check.textContent = "Dalej";
    setFeedback("bad", "Poprawnie: <b>" + escapeHtml(answerText(state.current)) + "</b>", false);
  }

  save();
  updateMeta();
}

function reveal(){
  if (state.answered) return;
  el.input.readOnly = true;
  finish(false);
}

function submit(){
  if (state.answered){
    if (state.ok) return;
    ask();
    return;
  }
  const typed = el.input.value.trim();
  if (!typed){
    setFeedback("", "Wpisz odpowiedź albo pokaż rozwiązanie.", true);
    el.input.focus({ preventScroll: true });
    return;
  }
  finish(matches(typed, answerText(state.current)));
}

function updateMeta(){
  el.mLearned.textContent = "Poznane " + state.learned.size + " / " + WORDS.length;
  el.mStats.textContent = "Poprawne " + state.correct + " · Błędy " + state.wrong + " · Seria " + state.streak;
  el.barFill.style.width = (state.learned.size / WORDS.length * 100).toFixed(1) + "%";
}

/* ---------- flashcards ---------- */

const flash = { deck: [], index: 0, flipped: false };

function buildDeck(){
  flash.deck = shuffle(pool());
  flash.index = 0;
  flash.flipped = false;
  renderFlash();
}

function renderFlash(){
  const word = flash.deck[flash.index];
  if (!word) return;

  el.fcCat.textContent = CAT_LABELS[word.cat];
  el.fcFront.textContent = questionText(word);
  el.fcBack.textContent = answerText(word);
  el.fcProgress.textContent = (flash.index + 1) + " / " + flash.deck.length;

  flash.flipped = false;
  el.flip.classList.remove("is-flipped");
  el.flip.setAttribute("aria-expanded", "false");
  setFlashReady(false);
}

function setFlashReady(ready){
  el.fcActions.classList.toggle("is-ready", ready);
  el.fcAgain.disabled = !ready;
  el.fcKnown.disabled = !ready;
}

function flipCard(){
  flash.flipped = !flash.flipped;
  el.flip.classList.toggle("is-flipped", flash.flipped);
  el.flip.setAttribute("aria-expanded", String(flash.flipped));
  setFlashReady(flash.flipped);
}

function nextCard(){
  if (flash.index + 1 < flash.deck.length){
    flash.index++;
  } else {
    flash.deck = shuffle(pool());
    flash.index = 0;
    toast("Nowa talia");
  }
  renderFlash();
}

function rateCard(known){
  const word = flash.deck[flash.index];
  if (!word || !flash.flipped) return;

  if (known){
    state.learned.add(word.en);
    state.correct++;
    state.streak++;
  } else {
    state.wrong++;
    state.streak = 0;
    if (flash.deck.length > 1) flash.deck.push(word);
  }

  save();
  updateMeta();
  nextCard();
}

/* ---------- speech ---------- */

function speak(text){
  if (!("speechSynthesis" in window)){
    toast("Ta przeglądarka nie wspiera wymowy");
    return;
  }
  const utter = new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g, ", ").replace(/\.\.\./g, ""));
  utter.lang = "en-US";
  utter.rate = 0.92;
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

/* ---------- theme ---------- */

const THEME_KEY = "bankSlowek.theme";

function currentTheme(){
  return document.documentElement.dataset.theme === "dark" ? "dark" : "light";
}

function applyTheme(theme){
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* storage blocked */ }

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "dark" ? "#0f0f11" : "#fafaf8");

  const label = theme === "dark" ? "Włącz tryb jasny" : "Włącz tryb ciemny";
  el.themeBtn.setAttribute("aria-label", label);
  el.themeBtn.setAttribute("title", theme === "dark" ? "Tryb jasny" : "Tryb ciemny");
}

function toggleTheme(){
  applyTheme(currentTheme() === "dark" ? "light" : "dark");
}

/* ---------- ui ---------- */

function setDirection(dir){
  state.dir = dir;
  [...el.dirSwitch.querySelectorAll(".seg-btn")].forEach((b) => b.classList.toggle("is-active", b.dataset.dir === dir));
  save();
  startRound();
}

function renderChips(){
  const items = [{ key: "all", label: "Wszystkie" }].concat(
    Object.keys(CAT_LABELS).map((key) => ({ key, label: CAT_LABELS[key] }))
  );

  el.chips.innerHTML = "";
  items.forEach((it) => {
    const count = it.key === "all" ? WORDS.length : WORDS.filter((w) => w.cat === it.key).length;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "filter" + (state.cat === it.key ? " is-active" : "");
    b.innerHTML = escapeHtml(it.label) + '<span class="n">' + count + "</span>";
    b.addEventListener("click", () => {
      state.cat = it.key;
      save();
      renderChips();
      startRound();
    });
    el.chips.appendChild(b);
  });
}

function renderList(){
  const q = normalize(el.search.value);
  const groups = Object.keys(CAT_LABELS)
    .map((cat) => ({
      cat,
      label: CAT_LABELS[cat],
      words: WORDS.filter((w) => w.cat === cat && (!q || normalize(w.en).includes(q) || normalize(w.pl).includes(q)))
    }))
    .filter((g) => g.words.length);

  if (!groups.length){
    el.listBody.innerHTML = '<p class="empty">Brak wyników.</p>';
    return;
  }

  el.listBody.innerHTML = groups.map((g) => {
    const rows = g.words.map((w) => {
      const done = state.learned.has(w.en) ? " is-done" : "";
      return '<div class="row' + done + '"><span class="en">' + escapeHtml(w.en) +
             '</span><span class="pl">' + escapeHtml(w.pl) + "</span></div>";
    }).join("");
    return '<div class="group"><h3>' + escapeHtml(g.label) + " · " + g.words.length + "</h3>" + rows + "</div>";
  }).join("");
}

el.form.addEventListener("submit", (e) => {
  e.preventDefault();
  submit();
});

el.revealBtn.addEventListener("click", reveal);

el.themeBtn.addEventListener("click", toggleTheme);

el.dirSwitch.addEventListener("click", (e) => {
  const btn = e.target.closest(".seg-btn");
  if (btn && btn.dataset.dir !== state.dir) setDirection(btn.dataset.dir);
});

el.speakBtn.addEventListener("click", () => {
  if (state.current) speak(state.current.en);
});

el.flip.addEventListener("click", flipCard);
el.fcKnown.addEventListener("click", () => rateCard(true));
el.fcAgain.addEventListener("click", () => rateCard(false));

document.addEventListener("keydown", (e) => {
  if (el.viewFlash.classList.contains("hidden")) return;
  if (e.target.tagName === "BUTTON") return;

  if (e.key === " " || (e.key === "Enter" && e.target === el.flip)){
    e.preventDefault();
    flipCard();
    return;
  }
  if (flash.flipped && e.key === "1") rateCard(false);
  if (flash.flipped && e.key === "2") rateCard(true);
});

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    const view = tab.dataset.view;
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("is-active", t === tab));

    el.viewLearn.classList.toggle("hidden", view !== "learn");
    el.viewFlash.classList.toggle("hidden", view !== "flash");
    el.viewList.classList.toggle("hidden", view !== "list");
    el.tools.classList.toggle("hidden", view === "list");

    if (view === "list"){
      clearTimeout(state.timer);
      renderList();
    } else if (view === "learn"){
      el.input.focus({ preventScroll: true });
    }
  });
});

el.search.addEventListener("input", renderList);

el.resetBtn.addEventListener("click", () => {
  if (!confirm("Wyzerować postęp i statystyki?")) return;
  state.learned = new Set();
  state.correct = 0;
  state.wrong = 0;
  state.streak = 0;
  save();
  updateMeta();
  renderList();
  startRound();
  toast("Postęp wyzerowany");
});

load();
applyTheme(currentTheme());
[...el.dirSwitch.querySelectorAll(".seg-btn")].forEach((b) => b.classList.toggle("is-active", b.dataset.dir === state.dir));
renderChips();
startRound();
renderList();
</script>
</body>
</html>
